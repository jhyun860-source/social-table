<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>관리자 로그인 · 소셜 테이블</title><link rel="stylesheet" href="../css/style.css"/></head>
<body>
<div class="login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--pink-lt);border:1px solid var(--pink-bd);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <i class="ti ti-shield-check" style="font-size:22px;color:var(--pink);"></i>
      </div>
      <div style="font-size:17px;font-weight:500;color:var(--txt);margin-bottom:4px;">관리자 로그인</div>
      <div style="font-size:12px;color:var(--txt3);">찜·매칭·실명·설정은 관리자만</div>
    </div>
    <div class="label" style="margin-top:0;">이메일</div>
    <input class="form-input" id="adm-email" type="email" placeholder="admin@socialtable.kr" autocomplete="username"/>
    <div class="label">비밀번호</div>
    <input class="form-input" id="adm-pw" type="password" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div class="error-msg" id="err">이메일 또는 비밀번호가 틀렸어요.</div>
    <button class="btn btn-primary mt-12" id="login-btn" onclick="doLogin()"><i class="ti ti-login"></i>로그인</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="../index.html" style="font-size:12px;color:var(--txt3);">← 메인으로</a>
    </div>
  </div>
</div>
<script type="module">
  import { adminLogin, onAdminAuthChange } from '../js/data.js';
  import { seedInitialData } from '../js/data.js';

  // 이미 로그인 상태면 대시보드로
  onAdminAuthChange(user => {
    if (user) location.href = 'dashboard.html';
  });

  window.doLogin = async function() {
    const email = document.getElementById('adm-email').value.trim();
    const pw    = document.getElementById('adm-pw').value;
    const err   = document.getElementById('err');
    const btn   = document.getElementById('login-btn');
    if (!email || !pw) { err.classList.add('show'); return; }
    btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i>로그인 중...';
    btn.disabled = true;
    try {
      await adminLogin(email, pw);
      await seedInitialData(); // 최초 1회 메뉴 초기화
      location.href = 'dashboard.html';
    } catch(e) {
      err.classList.add('show');
      document.getElementById('adm-pw').value = '';
      btn.innerHTML = '<i class="ti ti-login"></i>로그인';
      btn.disabled = false;
    }
  };
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
